<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join a Blitz Empire room</title>
<style>
  :root { color-scheme: dark; --bg:#0b1018; --panel:#141c2a; --text:#eef2f8; --muted:#9aa7bb; --gold:#e8b85c; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
  main { width:min(92vw,420px); padding:28px 24px; background:var(--panel); border-radius:24px; text-align:center; }
  h1 { margin:0 0 4px; font-size:22px; }
  p { color:var(--muted); margin:8px 0; }
  .code { font-size:44px; font-weight:800; letter-spacing:.18em; color:var(--gold); margin:12px 0; }
  a.btn { display:block; margin-top:16px; padding:14px; border-radius:999px; background:var(--gold); color:#2a1a00; font-weight:700; text-decoration:none; }
  a.ghost { display:block; margin-top:12px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Blitz Empire</h1>
  <p>A friend invited you to a room.</p>
  <div class="code" id="code">----</div>
  <a class="btn" id="open" href="#">Open the game</a>
  <a class="btn" id="web" href="https://axarapps.github.io/games/blitzempire/">Play in your browser</a>
  <a class="ghost" href="https://play.google.com/store/apps/details?id=com.axar.blitzempire">Or get the Android app</a>
</main>
<script>
  var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  document.getElementById('code').textContent = c || '----';
  var open = document.getElementById('open');
  var web = document.getElementById('web');
  if (c.length === 4) web.href = 'https://axarapps.github.io/games/blitzempire/?c=' + c;
  if (c.length === 4) {
    open.href = 'blitzempire://join/' + c;
    // on a phone with the game, jump straight in
    if (/android/i.test(navigator.userAgent)) setTimeout(function () { location.href = open.href; }, 400);
  } else {
    open.style.display = 'none';
  }
</script>
</body>
</html>
