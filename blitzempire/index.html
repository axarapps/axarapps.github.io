<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blitz Empire</title>
<meta name="description" content="Take the table before time runs out. A fast conquest game for up to six players. Play in your browser or on Android, together.">
<meta property="og:title" content="Blitz Empire">
<meta property="og:description" content="A fast conquest game for up to six players. Play in your browser or on Android, together.">
<meta property="og:image" content="https://axarapps.github.io/assets/blitz-empire.png">
<link rel="icon" href="../assets/blitz-empire.png">
<link rel="apple-touch-icon" href="../assets/blitz-empire.png">
<style>
  :root { color-scheme: dark; --bg:#0b1018; --panel:#141c2a; --text:#eef2f8; --muted:#9aa7bb; --gold:#e8b85c; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(120% 60% at 50% 0,#17263a,var(--bg)); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
  main { width:min(92vw,440px); padding:32px 24px; background:var(--panel); border-radius:28px; text-align:center; }
  img { width:96px; height:96px; border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { margin:14px 0 4px; font-size:26px; }
  p { color:var(--muted); margin:8px 0 18px; }
  a.btn { display:block; margin-top:12px; padding:15px; border-radius:999px; background:var(--gold); color:#2a1a00; font-weight:700; text-decoration:none; }
  a.ghost { display:block; margin-top:12px; padding:14px; border-radius:999px; border:2px solid #2c3a50; color:var(--text); font-weight:600; text-decoration:none; }
  .soon { display:block; margin-top:12px; padding:14px; border-radius:999px; border:2px dashed #2c3a50; color:var(--muted); font-weight:600; }
  small { display:block; margin-top:22px; color:var(--muted); }
  small a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <img src="../assets/blitz-empire.png" alt="">
  <h1>Blitz Empire</h1>
  <p>Take the table before time runs out. Up to six players, online. Friends on Android and in the browser play in the same room.</p>
  <a class="btn" href="../games/blitzempire/">Play in your browser</a>
  <span class="soon">Android app: coming soon on Google Play</span>
  <small>Free, no sign-up. <a href="https://akarafilovski.github.io/privacy-policies/blitzempire/">Privacy</a></small>
</main>
</body>
</html>
